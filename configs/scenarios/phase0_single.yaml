# Phase 0: one threat, one interceptor, one defended asset per environment.
#
# The launch state is derived, not written down: mdsim.world.scenario sizes the
# threat's speed from engagement_range_km on a drag-free flat-Earth arc and places it
# that far uprange of the battery. Terminal speed then emerges from that launch plus
# atmospheric drag on the entry's ballistic coefficient.
#
# 150 km is half the Scud-B's 300 km reach, so the shot is well inside its envelope.

name: phase0_single

n_threats: 1
n_interceptors: 1

threat: scud_b
interceptor: pac3_mse

engagement_range_km: 150.0
launch_elevation_deg: 45.0

battery_pos_m: [0.0, 0.0, 0.0]
