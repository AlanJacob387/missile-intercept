# Simulation core parameters.
#
# device is the requested backend. If it is unavailable at runtime the resolver
# falls back xpu -> cuda -> cpu and says so rather than failing.

dt: 0.05
n_envs: 1024
integrator: semi_implicit
seed: 0
device: xpu

# Lethal radius is a property of the interceptor's warhead, not of the simulation,
# so it lives per entry in configs/arsenal/interceptors.json.

# Proportional navigation gain. The classical usable band is 3-5.
pn_gain: 4.0

# Weapon-target assignment cadence. Reassignment is not free: an interceptor already
# flying at a threat cannot be re-aimed without throwing away the geometry it has
# built, so assignment runs on this interval and commitments hold until the round
# resolves. Every step would be reassignment thrash; too long and new tracks wait.
decision_interval_steps: 20

# A threat within this distance of its target city counts as having reached it.
# Wider than the interceptor kill radius by two orders of magnitude: this is a
# city-scale footprint, not a warhead-scale one.
city_impact_radius_m: 500.0

# Continuous white-acceleration spectral density for the tracker, in (m/s^2)^2/Hz.
# Read it as an unmodelled-acceleration budget: gravity is fed to the filter as a
# known input, so q has to cover everything else the constant-velocity model omits.
# Drag is the big one and it is NOT modelled by the tracker -- the defender does not
# know the threat's ballistic coefficient -- and it reaches ~2.9 g late in the
# trajectory. At q = 1.0 the filter is far too stiff to absorb that and terminal track
# error runs to kilometres; at 25.0 it settles near 39 m.
#
# Sweep-selected jointly with scud_b's ballistic coefficient over q x beta; see that
# entry's notes. Deliberately larger than the true process noise, which makes the
# filter conservative -- see the lower-bound note in tests/test_kalman.py.
kf_process_noise_q: 25.0

# Per-round aim/pointing error at launch, applied to the initial heading as a small
# 3D perturbation (radians, roughly the 1-sigma cone half-angle). Zero by default --
# every existing scenario keeps flying the exact deterministic heading it always has.
# A caller that wants dispersed rounds (real seeker/guidance systems do have some
# aim-point scatter at burnout) sets this explicitly; see
# tests/test_dispersion.py for the measured effect on single-shot Pk at a
# representative nonzero value.
aim_dispersion_rad: 0.0
